name: Gemini AI PR Reviewer Security Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      agent_mode:
        description: 'Agent to run (both, unshielded, or shielded)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - unshielded
          - shielded
      pr_number:
        description: 'PR number to test'
        required: false
        default: '3'

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  unshielded_agent:
    name: "Agent 1: Unshielded (No Guardrail)"
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'shielded-only')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.agent_mode == 'both' || github.event.inputs.agent_mode == 'unshielded'))
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/508782573230/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-pr-bot@siri-adventofagents.iam.gserviceaccount.com'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth requests

      - name: Invoke Agent 1 (Unshielded)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          REPO_NAME: ${{ github.repository }}
          GCP_PROJECT: "siri-adventofagents"
          GCP_LOCATION: "us-central1"
          REASONING_ENGINE_ID: "7007355004461776896"
          AGENT_MODE: "unshielded"
        run: |
          python .github/scripts/invoke_agent_engine.py

  shielded_agent:
    name: "Agent 2: Shielded (Model Armor Gateway)"
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'unshielded-only')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.agent_mode == 'both' || github.event.inputs.agent_mode == 'shielded'))
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/508782573230/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-pr-bot@siri-adventofagents.iam.gserviceaccount.com'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth requests

      - name: Invoke Agent 2 (Shielded)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          REPO_NAME: ${{ github.repository }}
          GCP_PROJECT: "siri-adventofagents"
          GCP_LOCATION: "us-central1"
          REASONING_ENGINE_ID: "3821621218050572288"
          AGENT_MODE: "shielded"
        run: |
          python .github/scripts/invoke_agent_engine.py
