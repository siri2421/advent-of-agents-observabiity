name: Gemini AI PR Reviewer Security Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      agent_mode:
        description: 'Agent to run (both, unshielded, or shielded)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - unshielded
          - shielded
      pr_number:
        description: 'PR number to test'
        required: false
        default: '3'

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  triage:
    name: ${{ matrix.agent.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent:
          - name: "Agent 1: Unshielded (No Guardrail)"
            mode: "unshielded"
            engine_id: "7007355004461776896"
          - name: "Agent 2: Shielded (Model Armor Gateway)"
            mode: "shielded"
            engine_id: "3821621218050572288"
    if: >
      (github.event_name == 'pull_request' &&
       (!contains(github.event.pull_request.labels.*.name, 'shielded-only') || matrix.agent.mode == 'shielded') &&
       (!contains(github.event.pull_request.labels.*.name, 'unshielded-only') || matrix.agent.mode == 'unshielded')) ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.agent_mode == 'both' || github.event.inputs.agent_mode == matrix.agent.mode))

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/508782573230/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-pr-bot@siri-adventofagents.iam.gserviceaccount.com'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth requests

      - name: Invoke ${{ matrix.agent.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          REPO_NAME: ${{ github.repository }}
          GCP_PROJECT: "siri-adventofagents"
          GCP_LOCATION: "us-central1"
          REASONING_ENGINE_ID: ${{ matrix.agent.engine_id }}
          AGENT_MODE: ${{ matrix.agent.mode }}
        run: |
          python .github/scripts/invoke_agent_engine.py
