name: Gemini AI PR Reviewer (Model Armor Protected)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-triage:
    name: AI Security & Code Triage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/508782573230/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-pr-bot@siri-adventofagents.iam.gserviceaccount.com'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth requests

      - name: Invoke Gemini Enterprise Agent Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
          GCP_PROJECT: "siri-adventofagents"
          GCP_LOCATION: "us-central1"
          # Deployed Shielded Agent Reasoning Engine ID
          REASONING_ENGINE_ID: "7830000808270757888"
        run: |
          python .github/scripts/invoke_agent_engine.py
